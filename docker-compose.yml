version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: driftlock
      POSTGRES_PASSWORD: driftlock
      POSTGRES_DB: driftlock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftlock"]
      interval: 10s
      timeout: 5s
      retries: 5

  be:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Compose exposes the API on 3000; local `bun run dev` defaults to 8787
      # (apps/be/src/config.ts). Keep VITE_API_URL below in sync with this mapping.
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://driftlock:driftlock@db:5432/driftlock
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WATCH_ENABLED: ${WATCH_ENABLED:-false}
      WATCH_INTERVAL_MS: ${WATCH_INTERVAL_MS:-21600000}
      WATCH_VENDORS: ${WATCH_VENDORS:-stripe}
      WATCH_BASELINES_DIR: /data/vendor-baselines
      DRIFTLOCK_PLAN: ${DRIFTLOCK_PLAN:-pro}
      DRIFTLOCK_MODEL: ${DRIFTLOCK_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/be:/app/apps/be
      - ./packages:/app/packages
      - vendor_baselines:/data/vendor-baselines

  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://driftlock:driftlock@db:5432/driftlock
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      WEBHOOK_REPO_PATH: ${WEBHOOK_REPO_PATH:-}
      WEBHOOK_OWNER: ${WEBHOOK_OWNER:-}
      WEBHOOK_REPO: ${WEBHOOK_REPO:-}
      WEBHOOK_BASE: ${WEBHOOK_BASE:-main}
      WEBHOOK_FORWARD_URL: ${WEBHOOK_FORWARD_URL:-}
      WEBHOOK_FORWARD_SECRET: ${WEBHOOK_FORWARD_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_AI_MODEL: ${CLOUDFLARE_AI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/webhook:/app/apps/webhook
      - ./packages:/app/packages

  fe:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install -g bun && bun install && bun run dev"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./apps/fe:/app
    depends_on:
      - be

volumes:
  postgres_data:
  vendor_baselines:
