# DriftLock BYOD — Dependabot, but for APIs. No Cloud key needed.
#
# SETUP (one time):
#   1. Replace __OWNER__, __REPO__, __BRANCH__ below with your repo.
#   2. Optional: repo Settings → Secrets → Actions → DRIFTLOCK_AI_KEY for model fixes.
#      Without it fixes are deterministic (renames, null checks, type coercions).
#   3. Save this file as .github/workflows/driftlock.yml and push.
#
# WHAT IT DOES (on schedule, every push/PR to __BRANCH__, or manual dispatch):
#   1. Scans the checkout for vendor API call sites (Stripe today).
#   2. Runs your test suite in an isolated sandbox and captures API traffic.
#   3. Diffs captured shapes against the committed baseline to detect drift.
#     First run only records the baseline and commits it back, so the next
#     scheduled run has something to compare against.
#   4. Prints suggested fixes in the job log. Nothing merges without your review.
#
# PLACEHOLDERS (fill by hand):
#   __OWNER__   GitHub org or user, e.g. acme
#   __REPO__    Repository name, e.g. payments
#   __BRANCH__  Default branch, e.g. main

name: DriftLock

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [__BRANCH__]
  pull_request:
    branches: [__BRANCH__]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install DriftLock CLI from source
        # @driftlock/cli is not on the npm registry yet, so bunx cannot
        # resolve it. Clone and install until the first publish, then switch
        # back to `bunx @driftlock/cli fix`.
        run: |
          git clone --depth 1 https://github.com/nerdev-co/DriftLock.git /tmp/driftlock
          cd /tmp/driftlock && bun install --frozen-lockfile

      - name: Detect drift and suggest fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: model fixes. Without these, fixes are deterministic
          # (renames, null checks, type coercions) — still automatic.
          # AI_PROVIDER: openai              # openai, anthropic, or gemini
          # AI_API_KEY: ${{ secrets.DRIFTLOCK_AI_KEY }}
          # AI_MODEL: gpt-4o-mini            # optional: fix model (GEMINI_MODEL for gemini)
        run: |
          set -o pipefail
          # Pull-request runs are detection-only: untrusted events must not
          # open PRs or push baselines. Scheduled/push runs may do both.
          FLAGS="--commit-baselines"
          REPO="--repo __OWNER__/__REPO__"
          if [ "${{ github.event_name }}" = "pull_request" ]; then FLAGS="--dry-run"; REPO=""; fi
          bun /tmp/driftlock/apps/cli/index.ts fix . $REPO --base __BRANCH__ --command "bun test" $FLAGS --json 2>/dev/null \
            | tail -n 1 > driftlock-summary.json
          cat driftlock-summary.json
